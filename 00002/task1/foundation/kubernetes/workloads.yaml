apiVersion: v1
kind: Namespace
metadata:
  name: wskorea26
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wskorea26-book
  namespace: wskorea26
spec:
  replicas: 2
  selector: {matchLabels: {app: book}}
  template:
    metadata: {labels: {app: book}}
    spec:
      nodeSelector: {node-type: app}
      containers:
        - name: book
          image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/wskorea26-book-repo:stable
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: book, namespace: wskorea26}
spec: {selector: {app: book}, ports: [{port: 80, targetPort: 8080}]}
