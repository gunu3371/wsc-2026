apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wsc2026-alerts
  namespace: observability
  labels:
    release: wsc2026-prometheus
spec:
  groups:
    - name: wsc2026
      rules:
        - { alert: PodHighCPU, expr: 'sum(rate(container_cpu_usage_seconds_total{namespace="wsc2026",container!=""}[5m])) by (pod) / sum(kube_pod_container_resource_limits{namespace="wsc2026",resource="cpu"}) by (pod) > 0.8', for: 3m }
        - { alert: PodHighMemory, expr: 'sum(container_memory_working_set_bytes{namespace="wsc2026",container!=""}) by (pod) / sum(kube_pod_container_resource_limits{namespace="wsc2026",resource="memory"}) by (pod) > 0.9', for: 3m }
        - { alert: PodNotReady, expr: 'kube_pod_status_ready{namespace="wsc2026",condition="true"} == 0', for: 3m }
        - { alert: PodCrashLooping, expr: 'kube_pod_container_status_waiting_reason{namespace="wsc2026",reason="CrashLoopBackOff"} == 1', for: 1m }
        - { alert: HighErrorRate, expr: 'sum(rate(log_metric_counter_http_requests_total{status=~"4..|5.."}[1m])) / clamp_min(sum(rate(log_metric_counter_http_requests_total[1m])), 0.001) > 0.05', for: 1m }
        - { alert: HighLatency, expr: 'sum(rate(log_metric_histogram_http_request_duration_seconds_sum[1m])) / clamp_min(sum(rate(log_metric_histogram_http_request_duration_seconds_count[1m])), 0.001) > 3', for: 1m }
